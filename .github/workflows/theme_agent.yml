name: Daily Theme Agent

on:
  schedule:
    # Mon–Fri 22:30 UTC (~6:30 PM ET) — after US market close
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "As-of date (YYYY-MM-DD). Leave empty for today (UTC)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  score-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve as-of date
        id: date
        run: |
          if [[ -n "${{ inputs.as_of }}" ]]; then
            echo "as_of=${{ inputs.as_of }}" >> "$GITHUB_OUTPUT"
          else
            echo "as_of=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-minilm-${{ runner.os }}-v1

      - name: Cache news RAG index
        uses: actions/cache@v4
        with:
          path: data/news_index
          key: news-index-${{ steps.date.outputs.as_of }}
          restore-keys: |
            news-index-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run theme agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python theme_agent.py --date "${{ steps.date.outputs.as_of }}"

      - name: Commit theme scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add theme_scores/
          if git diff --staged --quiet; then
            echo "No new or updated theme scores to commit."
          else
            git commit -m "theme scores ${{ steps.date.outputs.as_of }}"
            git push
          fi
